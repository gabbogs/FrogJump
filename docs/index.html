<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrogJump · Play in browser</title>
  <meta name="description" content="Play FrogJump, a 2D platformer: collect apples, avoid spikes." />
  <meta property="og:title" content="FrogJump" />
  <meta property="og:description" content="A 2D platformer you can play in your browser. Collect apples, avoid spikes." />
  <meta property="og:image" content="preview.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #f4f4f5; --muted: #a0a0a8; --line: #2a2a30; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: "Geist Mono", monospace; }
    /* The game fills the whole window (see game.js) */
    #stage { position: fixed; inset: 0; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); line-height: 2.2;
      pointer-events: none; /* clicks go through to the game */
    }
    .overlay[hidden] { display: none; }
    #hint { place-items: start center; padding-top: 12px; transition: opacity .4s; }
    #hint div, #quit div { background: rgba(0, 0, 0, .7); border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; }
    #hint strong, #quit strong { color: var(--ink); font-weight: 400; }
    kbd { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink); }
    .corner { position: fixed; top: 10px; right: 12px; display: flex; gap: 8px; }
    .corner a, .corner button {
      font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; cursor: pointer;
      color: var(--muted); background: rgba(0, 0, 0, .6); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
    }
    .corner a:hover, .corner button:hover { color: var(--ink); }
    .corner [hidden] { display: none; }
    :fullscreen .corner { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1664" height="896"></canvas>
    <div id="loading" class="overlay">Loading…</div>
    <div id="hint" class="overlay" hidden>
      <div>
        <strong>Click Play or press Enter</strong><br />
        <kbd>A</kbd> <kbd>D</kbd> move · <kbd>W</kbd> / <kbd>Space</kbd> jump · <kbd>Esc</kbd> pause · <kbd>M</kbd> mute
      </div>
    </div>
    <div id="quit" class="overlay" hidden>
      <div><strong>Thanks for playing!</strong><br />Click anywhere to go back to the menu</div>
    </div>
    <div class="corner">
      <button id="fullscreen" type="button" hidden>Fullscreen</button>
      <a href="https://github.com/gabbogs/FrogJump">source ↗</a>
    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const hint = document.getElementById("hint");
    const fsButton = document.getElementById("fullscreen");

    // True fullscreen is optional, from the corner button
    fsButton.addEventListener("click", () => {
      if (!document.fullscreenElement && stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
    });
    if (document.fullscreenEnabled) fsButton.hidden = false;

    // The hint isn't needed once someone starts playing
    const hideHint = (e) => { if (!e.target.closest || !e.target.closest(".corner")) hint.style.opacity = 0; };
    stage.addEventListener("pointerdown", hideHint, { capture: true });
    window.addEventListener("keydown", hideHint, { once: true });
  </script>
  <script src="game.js"></script>
</body>
</html>
